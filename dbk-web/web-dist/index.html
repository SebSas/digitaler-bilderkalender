<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1, user-scalable=no" />
  <title>Digitaler Bilderkalender</title>

  <style>
    :root {
      --bg: #0b0f1a;
      --glass: rgba(10,16,28,.45);
      --glass-border: rgba(255,255,255,.10);
      --text: rgba(255,255,255,.92);
      --muted: rgba(255,255,255,.78);
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: var(--bg);
      overflow: hidden;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, Noto Sans, Arial, sans-serif;
      color: var(--text);
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      touch-action: pan-y;
    }

    #app {
      position: relative;
      width: 100vw;
      height: 100vh;
      background: var(--bg);
    }

    .layer {
      position: absolute;
      inset: 0;
      overflow: hidden;
      background: var(--bg);
    }

    .img {
      position: absolute;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scale(1.02);
      opacity: 0;
      transition: opacity 900ms ease;
      will-change: opacity, transform;
      pointer-events: none;
    }

    .img.show { opacity: 1; }

    /* subtle premium zoom (Ken Burns light) */
    .img.kenburns {
      animation: kenburns 18s ease-in-out forwards;
    }
    @keyframes kenburns {
      0%   { transform: scale(1.02) translate3d(0,0,0); }
      100% { transform: scale(1.08) translate3d(-1.5%, -1%, 0); }
    }

    .nowbar {
      position: absolute;
      left: 24px;
      right: 24px;
      bottom: 20px;
      padding: 14px 18px;
      border-radius: 18px;
      background: var(--glass);
      border: 1px solid var(--glass-border);
      backdrop-filter: blur(10px);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      box-shadow: 0 20px 60px rgba(0,0,0,.45);
    }

    .left { display: flex; flex-direction: column; gap: 2px; }
    .time { font-size: 34px; font-weight: 750; line-height: 1.1; letter-spacing: .2px; }
    .date { font-size: 16px; opacity: .85; }
    .right { font-size: 14px; opacity: .8; text-align: right; max-width: 50%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    .pill {
      position: absolute;
      left: 16px;
      top: 16px;
      padding: 8px 10px;
      border-radius: 14px;
      background: rgba(0,0,0,.35);
      border: 1px solid rgba(255,255,255,.10);
      font-size: 12px;
      opacity: .82;
      backdrop-filter: blur(8px);
      max-width: 60vw;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .touchhint {
      position: absolute;
      top: 16px;
      right: 16px;
      padding: 8px 10px;
      border-radius: 14px;
      background: rgba(0,0,0,.35);
      border: 1px solid rgba(255,255,255,.10);
      font-size: 12px;
      opacity: .75;
      backdrop-filter: blur(8px);
    }

    .overlay {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      background: radial-gradient(900px 700px at 30% 20%, rgba(60,80,255,.15), transparent),
                  rgba(0,0,0,.55);
      z-index: 20;
    }

    .card {
      width: min(720px, 92vw);
      border-radius: 22px;
      padding: 22px;
      background: rgba(15, 22, 40, 0.72);
      border: 1px solid rgba(255,255,255,.12);
      backdrop-filter: blur(12px);
      box-shadow: 0 20px 60px rgba(0,0,0,.45);
    }

    .title { font-size: 22px; font-weight: 800; margin-bottom: 8px; }
    .text { font-size: 16px; opacity: .9; margin-bottom: 10px; }
    .hint { font-size: 13px; opacity: .75; margin-top: 6px; }

    .debug {
      position: absolute;
      top: 14px;
      left: 14px;
      padding: 12px;
      border-radius: 14px;
      background: rgba(0,0,0,.55);
      border: 1px solid rgba(255,255,255,.12);
      font-size: 12px;
      line-height: 1.45;
      backdrop-filter: blur(8px);
      z-index: 30;
    }

    .secretTapZone {
      position: absolute;
      top: 0;
      right: 0;
      width: 120px;
      height: 120px;
      z-index: 40;
      background: transparent;
    }
  </style>
</head>

<body>
  <div id="app">
    <div class="layer">
      <img id="imgA" class="img" alt="" />
      <img id="imgB" class="img" alt="" />
      <div id="filePill" class="pill" style="display:none"></div>
      <div class="touchhint">Wischen: zurück/vor • 5× oben rechts: Debug</div>
    </div>

    <div class="nowbar">
      <div class="left">
        <div id="time" class="time">--:--</div>
        <div id="date" class="date">---</div>
      </div>
      <div id="subtitle" class="right">Digitaler Bilderkalender</div>
    </div>

    <div id="overlay" class="overlay" style="display:none">
      <div class="card">
        <div id="overlayTitle" class="title">Loading…</div>
        <div id="overlayText" class="text">Bitte kurz warten…</div>
        <div class="hint">Tipp: 5× oben rechts tippen → Debug</div>
      </div>
    </div>

    <div id="debug" class="debug" style="display:none"></div>
    <div id="secretTapZone" class="secretTapZone"></div>
  </div>

  <script type="module" src="/app/main.js"></script>
</body>
</html>
