<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1, user-scalable=no" />
  <title>Digitaler Bilderkalender</title>

  <style>
#subtitle{display:none!important;}

    :root {
      --bg: #0b0f1a;
      --glass: rgba(10,16,28,.45);
      --glass-border: rgba(255,255,255,.10);
      --text: rgba(255,255,255,.92);
      --muted: rgba(255,255,255,.78);
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: var(--bg);
      overflow: hidden;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, Noto Sans, Arial, sans-serif;
      color: var(--text);
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      touch-action: pan-y;
    }

    #app {
      position: relative;
      width: 100vw;
      height: 100vh;
      background: var(--bg);
    }

    .layer {
      position: absolute;
      inset: 0;
      overflow: hidden;
      background: var(--bg);
    }

    .img {
      position: absolute;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scale(1.02);
      opacity: 0;
      transition: opacity 900ms ease;
      will-change: opacity, transform;
      pointer-events: none;
    }

    .img.show { opacity: 1; }

    /* subtle premium zoom (Ken Burns light) */
    .img.kenburns {
      animation: kenburns 18s ease-in-out forwards;
    }
    @keyframes kenburns {
      0%   { transform: scale(1.02) translate3d(0,0,0); }
      100% { transform: scale(1.08) translate3d(-1.5%, -1%, 0); }
    }

    .footer {
      position: absolute;
      left: 24px;
      right: 24px;
      bottom: 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      z-index: 12;
    }

    .footer-collapsed {
      padding: 14px 18px;
      border-radius: 18px;
      background: var(--glass);
      border: 1px solid var(--glass-border);
      backdrop-filter: blur(10px);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      box-shadow: 0 20px 60px rgba(0,0,0,.45);
    }

    .footer-collapsed .left { display: flex; flex-direction: column; gap: 10px; align-items: flex-start; text-align: left; }
    .footer-collapsed .right { display: flex; flex-direction: column; align-items: flex-end; justify-content: center; gap: 6px; min-width: 200px; text-align: right; }
    .time { font-size: 50px; font-weight: 750; line-height: 1.05; letter-spacing: .2px; }
    .date { font-size: 26px; opacity: .85; }

    .holiday-label {
      font-size: 24px;
      opacity: .9;
      max-width: 42vw;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .location-label {
      font-size: 50px;
      opacity: .9;
      max-width: 42vw;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .city-weather-row {
      display: flex;
      align-items: center;
      gap: 14px;
      flex-wrap: nowrap;
    }

    .weather-pill {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 4px;
      padding: 10px 12px;
      border-radius: 14px;
      background: rgba(0,0,0,.30);
      border: 1px solid rgba(255,255,255,.12);
      min-width: 160px;
    }

    .weather-pill-line1 { font-size: 24px; font-weight: 650; line-height: 1.1; }
    .weather-pill-line2 { font-size: 22px; opacity: .85; max-width: 240px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    .weather-icon {
      font-family: "Segoe Fluent Icons", "Segoe MDL2 Assets", "Segoe UI Symbol", "Segoe UI Emoji", sans-serif;
    }

    .weather-icon svg {
      width: 28px;
      height: 28px;
      display: inline-block;
      vertical-align: middle;
      color: rgba(255,255,255,.95);
    }

    .weather-pill-line1 {
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .weather-temp-inline { display: inline-block; }

    .weather-today-main .weather-icon svg { width: 36px; height: 36px; }
    .forecast-icon .weather-icon svg { width: 28px; height: 28px; }

    .footer-expanded {
      max-height: 0;
      opacity: 0;
      transform: translateY(10px);
      pointer-events: none;
      transition: max-height 320ms ease, opacity 320ms ease, transform 320ms ease;
    }

    .footer.expanded .footer-expanded {
      max-height: 520px;
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
    }

    .footer-expanded-inner {
      padding: 16px 18px;
      border-radius: 18px;
      background: var(--glass);
      border: 1px solid var(--glass-border);
      backdrop-filter: blur(10px);
      box-shadow: 0 20px 60px rgba(0,0,0,.45);
      display: grid;
      grid-template-columns: 1.2fr 1fr;
      gap: 18px;
    }

    .calendar-header {
      font-size: 29px;
      font-weight: 700;
      margin-bottom: 8px;
      text-transform: capitalize;
    }

    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 6px;
    }

    .calendar-weekday {
      font-size: 19px;
      text-align: center;
      opacity: .75;
      padding: 4px 0;
    }

    .calendar-day {
      position: relative;
      font-size: 22px;
      text-align: center;
      padding: 10px 0;
      border-radius: 10px;
      background: rgba(0,0,0,.25);
      border: 1px solid rgba(255,255,255,.08);
    }

    .calendar-day.dim {
      opacity: .4;
      background: rgba(0,0,0,.18);
    }

    .calendar-day.today {
      background: rgba(255,255,255,.18);
      border-color: rgba(255,255,255,.35);
    }

    .holiday-dot {
      position: absolute;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #ffd27d;
      left: 50%;
      bottom: 4px;
      transform: translateX(-50%);
    }

    .weather-expanded {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .weather-unavailable {
      font-size: 22px;
      opacity: .85;
      padding: 8px 10px;
      border-radius: 10px;
      background: rgba(0,0,0,.25);
      border: 1px solid rgba(255,255,255,.10);
    }

    .weather-today {
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding: 10px 12px;
      border-radius: 12px;
      background: rgba(0,0,0,.25);
      border: 1px solid rgba(255,255,255,.10);
    }

    .weather-today-main {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 24px;
      font-weight: 650;
    }

    .weather-today-text { font-size: 22px; opacity: .9; }

    .weather-forecast {
      display: flex;
      gap: 10px;
    }

    .forecast-day {
      flex: 1;
      padding: 10px 6px;
      border-radius: 12px;
      background: rgba(0,0,0,.22);
      border: 1px solid rgba(255,255,255,.08);
      text-align: center;
      font-size: 19px;
    }

    .forecast-weekday { font-size: 19px; opacity: .85; margin-bottom: 4px; }
    .forecast-icon { font-size: 26px; margin-bottom: 2px; }
    .forecast-temp { font-size: 19px; opacity: .9; }

    @media (max-width: 900px) {
      .footer { left: 16px; right: 16px; bottom: 16px; }
      .footer-expanded-inner { grid-template-columns: 1fr; }
      .calendar-grid { gap: 4px; }
    }

    .pill {
      position: absolute;
      left: 16px;
      top: 16px;
      padding: 8px 10px;
      border-radius: 14px;
      background: rgba(0,0,0,.35);
      border: 1px solid rgba(255,255,255,.10);
      font-size: 12px;
      opacity: .82;
      backdrop-filter: blur(8px);
      max-width: 60vw;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .touchhint {
      position: absolute;
      top: 16px;
      right: 16px;
      padding: 8px 10px;
      border-radius: 14px;
      background: rgba(0,0,0,.35);
      border: 1px solid rgba(255,255,255,.10);
      font-size: 12px;
      opacity: .75;
      backdrop-filter: blur(8px);
    }

    .overlay {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      background: radial-gradient(900px 700px at 30% 20%, rgba(60,80,255,.15), transparent),
                  rgba(0,0,0,.55);
      z-index: 20;
    }

    .card {
      width: min(720px, 92vw);
      border-radius: 22px;
      padding: 22px;
      background: rgba(15, 22, 40, 0.72);
      border: 1px solid rgba(255,255,255,.12);
      backdrop-filter: blur(12px);
      box-shadow: 0 20px 60px rgba(0,0,0,.45);
    }

    .title { font-size: 22px; font-weight: 800; margin-bottom: 8px; }
    .text { font-size: 16px; opacity: .9; margin-bottom: 10px; }
    .hint { font-size: 13px; opacity: .75; margin-top: 6px; }

    .debug {
      position: absolute;
      top: 14px;
      left: 14px;
      padding: 12px;
      border-radius: 14px;
      background: rgba(0,0,0,.55);
      border: 1px solid rgba(255,255,255,.12);
      font-size: 12px;
      line-height: 1.45;
      backdrop-filter: blur(8px);
      z-index: 30;
    }

    .secretTapZone {
      position: absolute;
      top: 0;
      right: 0;
      width: 120px;
      height: 120px;
      z-index: 40;
      background: transparent;
    }
  </style>
  <style>
    .goog-te-banner-frame,
    #goog-gt-tt,
    .goog-te-gadget {
      display: none !important;
    }
    body { top: 0 !important; }
  </style>

  <meta name="google" content="notranslate" />
</head>

<body>
  <div id="app">
    <div class="layer">
      <img id="imgA" class="img" alt="" />
      <img id="imgB" class="img" alt="" />
      <div id="filePill" class="pill" style="display:none"></div>
      <div class="touchhint" style="display:none">Wischen: zurück/vor • 5× oben rechts: Debug</div>
    </div>

    <div id="footer" class="footer">
      <div id="footerCollapsed" class="footer-collapsed">
        <div class="left">
          <div class="city-weather-row">
            <div id="locationLabel" class="location-label" style="display:none"></div>
            <div id="weatherPill" class="weather-pill" style="display:none">
              <div id="weatherPillLine1" class="weather-pill-line1">--</div>
              <div id="weatherPillLine2" class="weather-pill-line2">---</div>
            </div>
          </div>
          <div id="holidayLabel" class="holiday-label" style="display:none"></div>
        </div>
        <div class="right">
          <div id="time" class="time">--:--</div>
          <div id="date" class="date">---</div>
          <div id="subtitle" style="display:none"></div>
        </div>
      </div>

      <div id="footerExpanded" class="footer-expanded" aria-hidden="true">
        <div class="footer-expanded-inner">
          <div class="calendar">
            <div id="calendarHeader" class="calendar-header">---</div>
            <div id="calendarGrid" class="calendar-grid"></div>
          </div>
          <div id="weatherExpanded" class="weather-expanded">
            <div id="weatherUnavailable" class="weather-unavailable" style="display:none">Wetter nicht verfügbar</div>
            <div id="weatherToday" class="weather-today">
              <div class="weather-today-main">
                <span id="weatherTodayIcon" class="weather-icon">--</span>
                <span id="weatherTodayTemp" class="weather-temp">--°C</span>
              </div>
              <div id="weatherTodayText" class="weather-today-text">---</div>
            </div>
            <div id="weatherForecast" class="weather-forecast"></div>
          </div>
        </div>
      </div>
    </div>

    <div id="overlay" class="overlay" style="display:none">
      <div class="card">
        <div id="overlayTitle" class="title">Loading…</div>
        <div id="overlayText" class="text">Bitte kurz warten…</div>
        <div class="hint">Tipp: 5× oben rechts tippen → Debug</div>
      </div>
    </div>

    <div id="debug" class="debug" style="display:none"></div>
    <div id="secretTapZone" class="secretTapZone"></div>
  </div>

  <script type="module" src="/app/main.js"></script>
  <script>
    // Aggressively remove Google Translate UI if injected.
    (function() {
      function scrub() {
        try {
          var els = document.querySelectorAll('.goog-te-banner-frame, #goog-gt-tt, .goog-te-gadget, iframe.goog-te-banner-frame');
          els.forEach(function(el){ el.remove(); });
          document.body.style.top = '0px';
          document.documentElement.style.top = '0px';
        } catch (e) {}
      }
      scrub();
      setInterval(scrub, 1000);
    })();
  </script>
</body>
</html>
