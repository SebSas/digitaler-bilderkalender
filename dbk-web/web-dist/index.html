<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>DBK</title>
  <style>
    html,body{margin:0;height:100%;background:#000;overflow:hidden}
    #img{width:100%;height:100%;object-fit:contain;touch-action:manipulation}
    #hud{position:fixed;left:12px;top:10px;color:#fff;font:14px system-ui;opacity:.75}
    #dbg{position:fixed;left:12px;bottom:10px;right:12px;color:#fff;font:12px ui-monospace,monospace;opacity:.75;white-space:pre-wrap}
  </style>
</head>
<body>
  <div id="hud">DBK booting…</div>
  <div id="dbg"></div>
  <img id="img" />
  <script>
    const API = "";
    const INTERVAL_MS = 10000;

    const hud = document.getElementById("hud");
    const dbg = document.getElementById("dbg");
    const img = document.getElementById("img");

    function log(s){ dbg.textContent = (dbg.textContent + s + "\n").slice(-2000); }

    let list = [];
    let idx = 0;

    async function loadList(){
      hud.textContent = "DBK: loading list…";
      try{
        const r = await fetch(`${API}/api/images`, {cache:"no-store"});
        log(`GET /api/images -> ${r.status}`);
        if(!r.ok) throw new Error(`images status ${r.status}`);
        list = await r.json();
        log(`images count=${list.length}`);
        if(!list.length) hud.textContent = "DBK: no images";
        idx = 0;
      }catch(e){
        hud.textContent = "DBK: ERROR loading list";
        log(String(e));
      }
    }

    function show(i){
      if(!list.length) return;
      idx = (i + list.length) % list.length;
      const id = list[idx].id;
      const url = `${API}/api/image/${id}?t=${Date.now()}`;
      hud.textContent = `DBK ${idx+1}/${list.length}`;
      log(`img src=${url}`);
      img.src = url;
    }

    function next(){ show(idx+1); }
    function prev(){ show(idx-1); }

    img.onerror = () => { hud.textContent = "DBK: IMAGE LOAD ERROR"; log("img.onerror"); };

    document.body.addEventListener("click", (e)=>{
      const x = e.clientX || 0;
      if (x > window.innerWidth/2) next(); else prev();
    });

    let sx = null;
    document.body.addEventListener("touchstart",(e)=>{ sx = e.touches[0].clientX; }, {passive:true});
    document.body.addEventListener("touchend",(e)=>{
      if(sx==null) return;
      const ex = e.changedTouches[0].clientX;
      const dx = ex - sx;
      sx = null;
      if(Math.abs(dx) > 60) (dx < 0 ? next() : prev());
    }, {passive:true});

    (async ()=>{
      log("DBK debug start");
      await loadList();
      show(0);
      setInterval(next, INTERVAL_MS);
      setInterval(loadList, 60000);
    })();
  </script>
</body>
</html>
